<svg width="256" height="180" viewBox="0 0 256 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Back/Right loop of the W -->
    <path d="M 128 90 C 145 130 180 140 210 110 C 230 90 250 60 250 60 C 250 60 220 95 190 100 C 160 105 145 70 128 90 Z" fill="url(#grad2)"/>
    
    <!-- Middle connecting stroke -->
    <path d="M 80 130 C 110 160 140 140 160 90 C 180 40 160 20 140 30 C 120 40 90 100 80 130 Z" fill="url(#grad3)"/>
    
    <!-- Front/Left loop of the W -->
    <path d="M 10 90 C 30 60 50 50 80 60 C 110 70 140 110 140 110 C 140 110 110 140 80 130 C 50 120 30 110 10 90 Z" fill="url(#grad1)"/>
  </g>
</svg>
